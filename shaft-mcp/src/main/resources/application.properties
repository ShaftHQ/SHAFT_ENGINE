spring.application.name=shaft-mcp
spring.main.web-application-type=none
spring.ai.mcp.server.name=shaft-mcp
spring.ai.mcp.server.version=@project.version@
spring.ai.mcp.server.stdio=true

# STDIO is a protocol-only stdout channel. Send application logs to stderr.
spring.main.banner-mode=off

# Delivered to every MCP client for free in the initialize response (issue #4239 P2.1): the locator
# policy, the record -> confirm-replay -> generate -> verify ordering, per-surface tool routing, and
# how to read successful/status. Keep this in sync with shaft-skills/shaft-developer,
# shaft-locator-design, shaft-test-recording, and shaft-automated-test-authoring.
spring.ai.mcp.server.instructions=SHAFT MCP server. Locator policy, three tiers, stop at the first \
that uniquely matches: (1) a unique, author-written id through the SHAFT locator builder \
(hasAnyTagName().hasId(...)) -- never a framework-recycled id such as :r1:, mat-input-3, \
cdk-overlay-0, ember1234, j_idt42, ctl00_..., or sc-bdVaJa; (2) the same builder's ARIA role \
(hasRole(...)), chained with hasNormalizedText/hasAttribute/context until it uniquely matches; \
(3) native relative By.xpath(...) only when the element has neither. Never generate \
SHAFT.GUI.Locator.xpath(...), the raw SHAFT.GUI.Locator.id/name/cssSelector/className/tagName(...) \
factories, or a Smart Locator (inputField/clickableField) in generated or repo code. \
Ordering: record with capture_start, confirm the flow is real via replay \
(capture_generate_replay with replay=true, or verify_run_focused) before trusting generated code, \
then generate code blocks (capture_code_blocks / capture_record_at_target_code_blocks), then verify \
by running the test. Per-surface tool routing: web/Playwright use browser_*/element_*/driver_initialize; \
mobile/Appium use mobile_*; API capture uses capture_api_*; failure analysis uses \
doctor_*/healer_*/trace_*. Reading results: successful=true or status=SUCCESS means the output is \
replay-proven; successful=false or status=UNCONFIRMED means codegen-only output that has not been \
proven to pass and must not be treated as done.
