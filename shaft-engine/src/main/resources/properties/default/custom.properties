# SHAFT custom overrides
# Keep only the properties you want to customize. Any property left with its default value below behaves the same as SHAFT defaults.
# Learn more from the user guide: https://shafthq.github.io/

# Execution platform
executionAddress=local
targetOperatingSystem=Linux

# Browser configuration
targetBrowserName=chrome
headlessExecution=false

# Reporting and performance
retryMaximumNumberOfAttempts=0
screenshotParamsWhenToTakeAScreenshot=ValidationPointsOnly

# Optional explainable element recovery
healing.strategy=disabled
healing.minimumConfidence=0.75
healing.minimumTrustPercentage=-1
healing.ambiguityMargin=0.10
healing.evidenceCategories=accessibility,label,test-id,stable-id-name,semantic,dom-fingerprint,native-state,ancestor-context,history
healing.testIdAttributes=data-testid,data-test,data-qa
healing.history.enabled=true
healing.history.path=target/shaft-heal/history.json
healing.history.maxEntries=500
healing.history.retentionDays=30
healing.visual.enabled=false
shaft.ocr.cacheDirectory=
shaft.ocr.downloadEnabled=true
shaft.ocr.document.renderDpi=300
shaft.ocr.document.maximumInputBytes=536870912
shaft.ocr.document.maximumPages=1000
shaft.ocr.document.maximumPixelsPerPage=40000000
shaft.ocr.document.pageTimeoutSeconds=120
shaft.ocr.document.maximumAllureArtifactBytes=26214400
shaft.ocr.document.batchParallelism=4
shaft.ocr.document.maximumInFlightRasterBytes=268435456
healing.ai.enabled=false
healing.ai.trigger=ambiguous
healing.sourcePatch.enabled=false

# Optional natural-language GUI actions
naturalActions.enabled=false
naturalActions.minimumTrustPercentage=85
naturalActions.planner=deterministic
naturalActions.aiFallback.enabled=false
naturalActions.allowedActions=browser,element,touch

# Optional API capture recording
capture.api.enabled=false
capture.api.maxBodyBytes=1048576
capture.api.includeAssets=false
capture.api.firstPartyOnly=true
capture.api.storeSecretsLocally=false
capture.api.maxTransactions=500
capture.api.urlIncludeGlobs=
capture.api.urlExcludeGlobs=

# Optional batteries-included local inference
managedLocalAi.enabled=false
managedLocalAi.transparentProvisioning=true
managedLocalAi.model=auto
managedLocalAi.cacheDirectory=
managedLocalAi.downloadTimeoutSeconds=900
managedLocalAi.lockTimeoutSeconds=30
managedLocalAi.launchTimeoutSeconds=120
