<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SHAFT Smart Web Form Fixture</title>
</head>
<body>
<h1>Web form</h1>
<form method="get" action="#" onsubmit="event.preventDefault();">
    <label>Text input
        <input type="text" name="my-text" id="my-text-id">
    </label>

    <label>Password
        <input type="password" name="my-password" autocomplete="off">
    </label>

    <label>Textarea
        <textarea name="my-textarea" rows="3"></textarea>
    </label>

    <label>Dropdown (datalist)
        <input list="my-options" name="my-datalist" placeholder="Type to search...">
        <datalist id="my-options">
            <option value="San Francisco"></option>
            <option value="New York"></option>
            <option value="Seattle"></option>
            <option value="Los Angeles"></option>
            <option value="Chicago"></option>
        </datalist>
    </label>

    <label>Date picker
        <input type="text" name="my-date">
    </label>

    <button type="submit">Submit</button>
</form>
</body>
</html>
