<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SHAFT Smart Login Fixture</title>
</head>
<body>
<form id="login-form" onsubmit="event.preventDefault();">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" aria-label="Username" placeholder="Username">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" aria-label="Password" placeholder="Password">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" aria-label="Email">

    <button type="submit">Submit</button>
    <input type="submit" value="LOGIN">
    <button type="button">Sign In</button>
</form>
</body>
</html>
