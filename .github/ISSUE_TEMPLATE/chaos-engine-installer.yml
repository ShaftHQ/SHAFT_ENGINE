name: ChaosEngine installer
description: Report a failed ChaosEngine installation with the fields the installer prefills.
title: "[ChaosEngine installer] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        This form is opened by the ChaosEngine installer when install verification fails.
        Keep the prefilled fields and add anything that is missing.
        Attach these files from the project (GitHub file attachments, not private absolute paths):
        - `.chaos-engine-state/install-trace.json`
        - `.chaos-engine-state/install-console.log`
        - `.chaos-engine-state/doctor-failure.json`
        Paste the full console log and doctor JSON below if you cannot attach the files.
  - type: input
    id: error_code
    attributes:
      label: Error code
      placeholder: CE-INSTALL-FAILED
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: Cause
    validations:
      required: true
  - type: input
    id: failed_phase
    attributes:
      label: Failed phase
    validations:
      required: true
  - type: input
    id: unhealthy
    attributes:
      label: Unhealthy components
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Python sys.platform (win32, linux, darwin).
  - type: input
    id: os_name
    attributes:
      label: OS name
      description: Windows, Linux, Darwin, or equivalent.
  - type: input
    id: os_version
    attributes:
      label: OS version
  - type: input
    id: architecture
    attributes:
      label: Architecture
      description: AMD64, arm64, x86_64, and similar.
  - type: input
    id: python_version
    attributes:
      label: Python version
  - type: input
    id: machine
    attributes:
      label: Machine
      description: Terse platform string (no hostname or home path).
  - type: input
    id: doctor_details
    attributes:
      label: Doctor details
      description: Bounded component:code pairs from doctor-failure.json.
  - type: input
    id: hosts_receipt
    attributes:
      label: Hosts receipt
      description: present/absent for `.chaos-engine-hosts.json`
  - type: input
    id: core_dir
    attributes:
      label: Core dir
      description: present/absent for `.chaos-engine/`
  - type: input
    id: install_py
    attributes:
      label: install.py
      description: present/absent for `.chaos-engine/install.py`
  - type: input
    id: install_trace
    attributes:
      label: Install trace (repo-relative)
      description: Use `.chaos-engine-state/install-trace.json`. Attach that file to this issue; a private absolute path is not useful.
  - type: textarea
    id: install_trace_snippet
    attributes:
      label: Install trace snippet
      description: Short redacted excerpt only. Attach the full install-trace.json file.
  - type: textarea
    id: console_log
    attributes:
      label: Full console log
      description: Paste the full installer console, or the contents of `.chaos-engine-state/install-console.log`.
    validations:
      required: true
  - type: textarea
    id: doctor_json
    attributes:
      label: Full doctor JSON
      description: Paste `doctor --json` or `.chaos-engine-state/doctor-failure.json`. Redact secrets.
    validations:
      required: true
  - type: input
    id: status_command
    attributes:
      label: Status command
  - type: input
    id: doctor_command
    attributes:
      label: Doctor command
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Terminal emulator, whether Java/Node were already installed, and anything else maintainers should know.
