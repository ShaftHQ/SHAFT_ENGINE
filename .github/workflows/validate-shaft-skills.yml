name: Validate Shaft Skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-skills:
    name: Validate marketplace.json vs shaft-skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate marketplace skills list
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.plugins[0].skills[]' .claude-plugin/marketplace.json > /tmp/marketplace-skills.txt
          # Normalize paths to just folder names
          sed -E 's|^(\./)?(shaft-skills/)?||' /tmp/marketplace-skills.txt | sed '/^$/d' | sort -u > /tmp/mp-skills-norm.txt

          if [ ! -d shaft-skills ]; then
            echo "ERROR: shaft-skills directory not found" >&2
            exit 1
          fi

          find shaft-skills -maxdepth 1 -type d -printf '%f\n' | sed '1d' | grep -v '^references$' | sort -u > /tmp/dir-skills.txt

          missing_dirs=$(comm -23 /tmp/mp-skills-norm.txt /tmp/dir-skills.txt || true)
          missing_mp=$(comm -13 /tmp/mp-skills-norm.txt /tmp/dir-skills.txt || true)

          errs=0
          if [ -n "$missing_dirs" ]; then
            echo "Skills listed in marketplace.json but missing under shaft-skills:" >&2
            echo "$missing_dirs" >&2
            errs=1
          fi
          if [ -n "$missing_mp" ]; then
            echo "Directories under shaft-skills not listed in marketplace.json:" >&2
            echo "$missing_mp" >&2
            errs=1
          fi

          # Check that every listed skill folder contains SKILL.md
          while read -r skill; do
            if [ -z "$skill" ]; then continue; fi
            if [ ! -f "shaft-skills/$skill/SKILL.md" ]; then
              echo "Missing SKILL.md for shaft-skills/$skill" >&2
              errs=1
            fi
          done < /tmp/mp-skills-norm.txt

          if [ "$errs" -ne 0 ]; then
            echo "Validation failed" >&2
            exit 1
          fi

          echo "marketplace.json and shaft-skills directory are consistent" 
