name: JavaDocs Publisher
# Publishes one navigable JavaDocs site after a successful Maven Central release.

on:
  workflow_run:
    workflows: [ "Maven Central Continuous Delivery" ]
    types: [ completed ]
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: javadocs-publisher
  cancel-in-progress: false

jobs:
  generate_java_docs:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      gpg.keyname: ${{ secrets.GPG_KEYNAME }}
      gpg.passphrase: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write  # if you have a protection rule on your repository, you'll need to give write permission to the workflow.
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: 'zulu'
          check-latest: true
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
      # cache-maven-repo, not setup-java's `cache: 'maven'` -- one key format
      # with restore-keys across every call site (issues #4440, #4444).
      - name: Cache Maven repository
        uses: ./.github/actions/cache-maven-repo
      - name: Set up Maven
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: 3.9.5
      # Captures the reactor version from the root pom.xml.
      - name: Set Release Version Number
        run: |
          echo "RELEASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
      - name: Publish updated JavaDocs
        uses: MathieuSoysal/Javadoc-publisher.yml@fda475b197081ba1eca7a1dfadf0c017080a1623 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          javadoc-branch: javadoc
          java-version: 25
          project: maven
          custom-command: mvn --batch-mode clean install "-DskipTests" "-Dgpg.skip" && mvn --batch-mode javadoc:javadoc && python3 scripts/ci/assemble_javadocs.py
          javadoc-source-folder: target/javadocs
