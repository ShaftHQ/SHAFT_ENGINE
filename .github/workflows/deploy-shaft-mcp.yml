name: Deploy shaft-mcp

on:
  workflow_run:
    # No branches filter: the upstream workflow now runs from `release: published`
    # events (a release tag, not main), so head_branch here is the tag name.
    workflows: ["Publish shaft-mcp Distributions"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-shaft-mcp
  cancel-in-progress: false

jobs:
  deploy-render:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping."
            exit 0
          fi
          curl --fail --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

  deploy-fly:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # #7035 (Scorecard Dangerous-Workflow): never check out a workflow_run head
      # directly. Start from the trusted default ref, then switch only to a commit
      # that a release tag in this repository points at, and only when the
      # upstream run came from this repository's release or manual dispatch and the
      # commit is tagged or on main.
      - name: Checkout trusted default ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Switch to the released commit
        if: github.event_name == 'workflow_run'
        env:
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "${RUN_EVENT}" in release|workflow_dispatch) ;; *) RUN_REPO="untrusted-event" ;; esac
          if [ "${RUN_REPO}" != "${REPO}" ]; then
            echo "::error::Refusing to deploy: upstream run event=${RUN_EVENT} repo=${RUN_REPO}"
            exit 1
          fi
          if ! git tag --points-at "${HEAD_SHA}" | grep -q . \
             && ! git merge-base --is-ancestor "${HEAD_SHA}" origin/main; then
            echo "::error::Refusing to deploy ${HEAD_SHA}: not a release tag and not on main"
            exit 1
          fi
          git checkout --detach "${HEAD_SHA}"
      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not configured; skipping."
            exit 0
          fi
          flyctl deploy --remote-only --config shaft-mcp/fly.toml

  smithery:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Record optional Smithery deployment handoff
        run: |
          echo "This job does not deploy to Smithery."
          echo "Connect ShaftHQ/SHAFT_ENGINE in Smithery, then verify the resulting /mcp endpoint."
