name: Publish shaft-mcp Distributions

on:
  release:
    types: [published]
  workflow_dispatch:

# #7036 (Scorecard Token-Permissions): top level is read-only; writes are
# granted per job.
permissions:
  contents: read

concurrency:
  group: publish-shaft-mcp
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Runs only for an actual published SHAFT release (created by mavenCentral_cd.yml's
    # announce_release job), not merely because that workflow's run concluded successfully -
    # its build_release_and_deliver job now also concludes successfully when it skips a
    # no-op delivery for an already-published version, which must not re-publish here.
    # Media releases (for example `shaft-hero-video-20261017`) also emit `release: published`;
    # only a SHAFT version tag (digits and dots, no '-') may publish the image (#7095).
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'release' && !contains(github.event.release.tag_name, '-'))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: 'zulu'
          check-latest: true
      - name: Read reactor version
        run: echo "VERSION=$(mvn -f pom.xml help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push OCI image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: shaft-mcp/Dockerfile
          push: true
          tags: |
            ghcr.io/shafthq/shaft-engine-mcp:${{ env.VERSION }}
            ghcr.io/shafthq/shaft-engine-mcp:latest
      # #7044: additive provenance; never blocks the already-pushed image.
      - name: Attest OCI image provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/shafthq/shaft-engine-mcp
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Materialize and validate MCP registry metadata
        working-directory: shaft-mcp
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("server.json")
          rendered = path.read_text(encoding="utf-8").replace("@project.version@", os.environ["VERSION"])
          path.write_text(rendered, encoding="utf-8")
          json.loads(rendered)
          PY
          python3 -m pip install --no-deps --requirement ../requirements-ci.txt --quiet
          python3 - <<'PY'
          import json
          import urllib.request
          from jsonschema import validate

          with open("server.json", encoding="utf-8") as source:
              server = json.load(source)
          with urllib.request.urlopen(server["$schema"]) as response:
              schema = json.load(response)
          validate(instance=server, schema=schema)
          PY
      - name: Publish MCP registry metadata
        working-directory: shaft-mcp
        run: |
          curl --fail --location \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar -xzf - mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
