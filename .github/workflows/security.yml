name: Security

# Phase 3 of the CI overhaul (issue #3814, B1): dependency-review moved to
# pr-gate.yml's own `dependency-review` job. This workflow now carries only
# CodeQL, which stays here rather than folding into pr-gate.yml because no
# org-wide CodeQL default setup is configured for this repository.

# Issue #6192: on pull requests CodeQL (java) runs only when a Maven Java input
# changes (68 of 94 PR runs analysed unchanged Java). Every push to `main` is
# still scanned, plus a weekly full scan, so every commit that can reach a
# release (mavenCentral_cd.yml releases from `main`) is analysed first.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - '**/src/main/resources/**'
      - '.mvn/**'
      - '.github/codeql/**'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          check-latest: true

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.9.5

      - name: Build all Java-bearing SHAFT modules
        run: mvn -B -pl shaft-infrastructure,shaft-engine,shaft-pilot-core,shaft-capture,shaft-capture-proxy,shaft-doctor,shaft-ai,shaft-heal,shaft-browserstack,shaft-video,shaft-visual,shaft-ocr,shaft-sikulix,shaft-mcp,report-aggregate -am clean package --file pom.xml -DskipTests -Dgpg.skip

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.1
