name: Security

# Phase 3 of the CI overhaul (issue #3814, B1): dependency-review moved to
# pr-gate.yml's own `dependency-review` job. This workflow now carries only
# CodeQL, which stays here rather than folding into pr-gate.yml because no
# org-wide CodeQL default setup is configured for this repository.

# Issue #6192: on pull requests CodeQL (java) runs only when a Maven Java input
# changes (68 of 94 PR runs analysed unchanged Java). Every push to `main` is
# still scanned, plus a weekly full scan, so every commit that can reach a
# release (mavenCentral_cd.yml releases from `main`) is analysed first.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - '**/src/main/resources/**'
      - '.mvn/**'
      - '.github/codeql/**'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:

# #7036 (Scorecard Token-Permissions): top level is read-only; writes are
# granted per job.
permissions:
  actions: read
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    name: CodeQL
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: 'zulu'
          check-latest: true

      - name: Set up Maven
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: 3.9.5

      - name: Build all Java-bearing SHAFT modules
        run: mvn -B -pl shaft-infrastructure,shaft-engine,shaft-pilot-core,shaft-capture,shaft-capture-proxy,shaft-doctor,shaft-ai,shaft-heal,shaft-browserstack,shaft-video,shaft-visual,shaft-ui-match,shaft-ocr,shaft-sikulix,shaft-mcp,report-aggregate -am clean package --file pom.xml -DskipTests -Dgpg.skip

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
