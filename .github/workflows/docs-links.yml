name: Docs links

# #7008: internal (offline) Markdown links are checked on every PR that touches
# a .md file (well under a minute); external links run weekly and open or update
# one tracker issue instead of blocking PRs on third-party sites.

on:
  pull_request:
    paths: ['**.md', 'lychee.toml', '.github/workflows/docs-links.yml']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-links-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  LYCHEE_VERSION: lychee-v0.24.2
  LYCHEE_SHA256: 73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5

jobs:
  links:
    name: ${{ github.event_name == 'schedule' && 'External links' || 'Internal links' }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ github.event_name == 'schedule' && 30 || 5 }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lychee (checksum-verified)
        run: |
          curl -fsSL -o lychee.tgz "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-musl.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/lychee" && tar -xzf lychee.tgz -C "$RUNNER_TEMP/lychee"
          find "$RUNNER_TEMP/lychee" -name lychee -type f -exec install -m 0755 {} "$RUNNER_TEMP/lychee-bin" \;
          rm lychee.tgz
      - name: Check links
        id: check
        env:
          EXTERNAL: ${{ github.event_name == 'schedule' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mode=(--offline)
          [ "$EXTERNAL" = "true" ] && mode=(--github-token "$GH_TOKEN")
          # .memory/** is tracked markdown. lychee.toml exclude_path drops it,
          # but the first xargs chunk is only those files, lychee exits 123,
          # and pipefail stops before any other markdown is checked.
          git ls-files -z -- '*.md' ':!.memory' | xargs -0 "$RUNNER_TEMP/lychee-bin" --config lychee.toml --no-progress \
            --root-dir "$GITHUB_WORKSPACE" "${mode[@]}" --format markdown --output lychee-report.md
      - name: Summary
        if: always()
        run: '[ -f lychee-report.md ] && head -c 60000 lychee-report.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Open or update the external-links tracker
        if: failure() && steps.check.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Broken external documentation links"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still broken: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "The weekly lychee run found broken external links (#7008): ${RUN_URL}"
          fi
