name: Setup Lock Pins

# Issue #6357: every Dependabot npm bump to a bundled setup lockfile changes its
# SHA-256 while the planner constant that pins it (the approved-plan integrity
# check) stays put, so `Unit Tests (shaft-infrastructure)` fails with
# fingerprint `setup-lock-pin-drift`. Issue #6381: the planners also pin each
# planned package's version, registry tarball SHA-256 and size
# (`setup-package-pin-drift`). The pins are kept; this workflow only refreshes
# them, and pins a tarball only after it matches the lockfile sha512 integrity.
#
# * `check` runs on ordinary pull requests touching the lockfiles, planners, or
#   this tooling: unit tests plus `refresh_setup_lock_pins.py --check
#   --verify-artifacts` (downloads the planned tarballs from npm).
# * `refresh` runs on `pull_request_target` for same-repository Dependabot pull
#   requests only. It executes the trusted script from the base checkout
#   against the pull-request tree (it only reads and hashes files; nothing from
#   the pull request is executed) and pushes the refreshed pins with
#   `BOT_TOKEN`. A PAT push fires `synchronize`, so PR Gate runs on the new
#   head; a `GITHUB_TOKEN` push would not trigger any workflow.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'shaft-infrastructure/src/main/resources/com/shaft/infrastructure/**/package-lock.json'
      - 'shaft-infrastructure/src/main/resources/com/shaft/infrastructure/**/package.json'
      - 'shaft-infrastructure/src/main/java/com/shaft/infrastructure/*SetupPlanner.java'
      - 'scripts/ci/refresh_setup_lock_pins.py'
      - 'tests/scripts/test_refresh_setup_lock_pins.py'
      - '.github/workflows/setup-lock-pins.yml'
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'shaft-infrastructure/src/main/resources/com/shaft/infrastructure/**/package-lock.json'

permissions:
  contents: read

concurrency:
  group: setup-lock-pins-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Setup lock pin check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Run setup lock pin unit tests
        run: python3 -m unittest tests.scripts.test_refresh_setup_lock_pins -v
      - name: Check setup pins match the bundled manifests, lockfiles and tarballs
        run: python3 scripts/ci/refresh_setup_lock_pins.py --check --verify-artifacts

  refresh:
    name: Refresh Dependabot setup lock pins
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v7.0.1
        with:
          path: base
          persist-credentials: false
      - name: Verify BOT_TOKEN can push (#6370)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          fallback="Fallback: run 'python3 scripts/ci/refresh_setup_lock_pins.py --write' on the PR branch and push."
          if [ -z "${BOT_TOKEN}" ]; then
            echo "::error title=BOT_TOKEN missing::The org BOT_TOKEN secret is empty, so the lock-pin refresh cannot push. ${fallback}"
            exit 1
          fi
          push=$(curl -fsS -H "Authorization: Bearer ${BOT_TOKEN}" "https://api.github.com/repos/${REPO}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("permissions",{}).get("push",False))') || push=error
          if [ "${push}" != "True" ]; then
            echo "::error title=BOT_TOKEN expired or lacks push::BOT_TOKEN could not authenticate with push access (got: ${push}). Renew the org BOT_TOKEN PAT. ${fallback}"
            exit 1
          fi
      - name: Checkout Dependabot head
        uses: actions/checkout@v7.0.1
        with:
          path: head
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.BOT_TOKEN }}
      - name: Set up Python 3.13
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Refresh pins with the base script
        run: python3 base/scripts/ci/refresh_setup_lock_pins.py --root head --write
      - name: Push refreshed pins
        working-directory: head
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "setup lock pins already match"
            exit 0
          fi
          git config user.name "shaft-lock-pin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh setup lock and package pins for the Dependabot bump." \
            -m "Generated by .github/workflows/setup-lock-pins.yml (#6357, #6381)."
          if ! git push origin "HEAD:refs/heads/${HEAD_REF}"; then
            echo "::error title=Lock-pin push rejected::Push with BOT_TOKEN was rejected; renew the org BOT_TOKEN PAT. Fallback: run 'python3 scripts/ci/refresh_setup_lock_pins.py --write' on the PR branch and push."
            exit 1
          fi
