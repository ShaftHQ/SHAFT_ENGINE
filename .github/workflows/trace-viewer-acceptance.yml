name: Trace Viewer Browser Acceptance

on:
  pull_request:
    paths:
      - "shaft-engine/src/main/java/com/shaft/tools/io/internal/**"
      - "shaft-engine/src/test/java/com/shaft/tools/io/internal/TraceViewerBrowserAcceptanceTest.java"
      - "shaft-engine/src/test/java/com/shaft/tools/io/internal/PlaywrightTraceParityAcceptanceTest.java"
      - "tests/scripts/test_trace_provider_acceptance_workflow.py"
      - ".github/workflows/trace-viewer-acceptance.yml"
  push:
    branches: [ main ]
    paths:
      - "shaft-engine/src/main/java/com/shaft/tools/io/internal/**"
      - "shaft-engine/src/test/java/com/shaft/tools/io/internal/TraceViewerBrowserAcceptanceTest.java"
      - "shaft-engine/src/test/java/com/shaft/tools/io/internal/PlaywrightTraceParityAcceptanceTest.java"
      - "tests/scripts/test_trace_provider_acceptance_workflow.py"
      - ".github/workflows/trace-viewer-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: trace-viewer-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright-native-trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-test-env
        with:
          node-version: "20"
      - name: Install Playwright browser
        run: >-
          mvn -f shaft-engine/pom.xml
          org.codehaus.mojo:exec-maven-plugin:3.6.3:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps ${{ matrix.browser }}"
          -Dallure.automaticallyOpen=false
      - name: Run native trace parity acceptance
        run: >-
          mvn -pl shaft-engine
          -Dtest=com.shaft.tools.io.internal.PlaywrightTraceParityAcceptanceTest
          -Dsurefire.excludedGroups=
          -Dshaft.trace.acceptance.browser=${{ matrix.browser }}
          -Dallure.automaticallyOpen=false
          -Dtelemetry.enabled=false
          test
      - name: Upload native trace parity coverage
        if: always()
        uses: ./.github/actions/upload-jacoco-coverage
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          required-files: ./shaft-engine/target/jacoco/jacoco.xml
          source-id: trace-viewer-native-${{ matrix.browser }}

  chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-test-env
        with:
          node-version: "20"
      - name: Run offline trace viewer acceptance
        run: >-
          mvn -pl shaft-engine
          -Dtest=com.shaft.tools.io.internal.TraceViewerBrowserAcceptanceTest
          -Dsurefire.excludedGroups=
          -Dshaft.trace.viewer.chrome=/usr/bin/google-chrome
          -Dshaft.trace.viewer.screenshot=target/trace-viewer-browser-acceptance.png
          -Dallure.automaticallyOpen=false
          -Dtelemetry.enabled=false
          test
      - name: Upload offline trace viewer coverage
        if: always()
        uses: ./.github/actions/upload-jacoco-coverage
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          required-files: ./shaft-engine/target/jacoco/jacoco.xml
          source-id: trace-viewer-offline-chromium
