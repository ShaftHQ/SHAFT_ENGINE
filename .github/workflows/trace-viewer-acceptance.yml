name: Trace Viewer Browser Acceptance

on:
  pull_request:
    paths:
      - "shaft-engine/src/main/java/com/shaft/tools/io/internal/**"
      - "shaft-engine/src/main/java/com/shaft/gui/browser/internal/**"
      - "shaft-engine/src/test/java/com/shaft/gui/browser/internal/BrowserNetworkUploadAcceptanceTest.java"
      - "shaft-engine/src/test/java/com/shaft/gui/browser/internal/BidiRequestBodyAcceptanceTest.java"
      - "shaft-engine/src/main/resources/META-INF/shaft/trace-viewer/**"
      - "shaft-engine/src/test/js/**"
      - "shaft-engine/src/test/java/com/shaft/tools/io/internal/TraceViewerBrowserAcceptanceTest.java"
      - "shaft-engine/src/test/java/com/shaft/tools/io/internal/TraceViewerAllureAcceptanceTest.java"
      - "shaft-engine/src/test/java/com/shaft/tools/io/internal/PlaywrightTraceParityAcceptanceTest.java"
      - "tests/scripts/test_trace_provider_acceptance_workflow.py"
      - ".github/workflows/trace-viewer-acceptance.yml"
  push:
    branches: [ main ]
    paths:
      - "shaft-engine/src/main/java/com/shaft/tools/io/internal/**"
      - "shaft-engine/src/main/java/com/shaft/gui/browser/internal/**"
      - "shaft-engine/src/test/java/com/shaft/gui/browser/internal/BrowserNetworkUploadAcceptanceTest.java"
      - "shaft-engine/src/test/java/com/shaft/gui/browser/internal/BidiRequestBodyAcceptanceTest.java"
      - "shaft-engine/src/main/resources/META-INF/shaft/trace-viewer/**"
      - "shaft-engine/src/test/js/**"
      - "shaft-engine/src/test/java/com/shaft/tools/io/internal/TraceViewerBrowserAcceptanceTest.java"
      - "shaft-engine/src/test/java/com/shaft/tools/io/internal/TraceViewerAllureAcceptanceTest.java"
      - "shaft-engine/src/test/java/com/shaft/tools/io/internal/PlaywrightTraceParityAcceptanceTest.java"
      - "tests/scripts/test_trace_provider_acceptance_workflow.py"
      - ".github/workflows/trace-viewer-acceptance.yml"

permissions:
  contents: read

env:
  ALLURE3_CLI_VERSION: "3.20.1"
  ALLURE2_CLI_VERSION: "2.46.1"

concurrency:
  group: trace-viewer-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright-native-trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-test-env
        with:
          node-version: "20"
      - name: Install Playwright browser
        run: >-
          mvn -f shaft-engine/pom.xml
          org.codehaus.mojo:exec-maven-plugin:3.6.3:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps ${{ matrix.browser }}"
          -Dallure.automaticallyOpen=false
      - name: Run native trace parity acceptance
        run: >-
          mvn -pl shaft-engine
          -Dtest=com.shaft.tools.io.internal.PlaywrightTraceParityAcceptanceTest
          -Dsurefire.excludedGroups=
          -Dshaft.trace.acceptance.browser=${{ matrix.browser }}
          -Dallure.automaticallyOpen=false
          -Dtelemetry.enabled=false
          test
      - name: Upload native trace parity coverage
        if: always()
        uses: ./.github/actions/upload-jacoco-coverage
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          required-files: ./shaft-engine/target/jacoco/jacoco.xml
          source-id: trace-viewer-native-${{ matrix.browser }}

  chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-test-env
        with:
          node-version: "20"
      # Both CLIs live under ~/.m2/repository, which setup-test-env restores and saves, so they are
      # downloaded once per cache and the Allure acceptance tests run instead of skipping (#6752).
      - name: Provision the Allure 2 and Allure 3 CLIs
        run: |
          allure3="$HOME/.m2/repository/allure/allure-cli/${ALLURE3_CLI_VERSION}"
          if [ ! -f "$allure3/node_modules/allure/cli.js" ]; then
            mkdir -p "$allure3"
            printf '%s\n' '{"name":"shaft-allure-cli-runtime","private":true}' > "$allure3/package.json"
            npm --prefix "$allure3" install --no-package-lock --no-save --ignore-scripts "allure@${ALLURE3_CLI_VERSION}"
          fi
          allure2="$HOME/.m2/repository/allure/allure2-cli/${ALLURE2_CLI_VERSION}"
          if [ ! -x "$allure2/allure-${ALLURE2_CLI_VERSION}/bin/allure" ]; then
            mkdir -p "$allure2"
            curl -fsSL -o "$RUNNER_TEMP/allure2.zip" "https://repo1.maven.org/maven2/io/qameta/allure/allure-commandline/${ALLURE2_CLI_VERSION}/allure-commandline-${ALLURE2_CLI_VERSION}.zip"
            unzip -q -o "$RUNNER_TEMP/allure2.zip" -d "$allure2"
          fi
      - name: Run offline trace viewer acceptance
        run: >-
          mvn -pl shaft-engine
          -Dtest=com.shaft.tools.io.internal.TraceViewerBrowserAcceptanceTest,com.shaft.tools.io.internal.TraceViewerAllureAcceptanceTest,com.shaft.gui.browser.internal.BrowserNetworkUploadAcceptanceTest,com.shaft.gui.browser.internal.BidiRequestBodyAcceptanceTest
          -Dsurefire.excludedGroups=
          -Dshaft.allure.cli.version=${ALLURE3_CLI_VERSION}
          -Dshaft.allure2.cli.version=${ALLURE2_CLI_VERSION}
          -Dshaft.trace.viewer.chrome=/usr/bin/google-chrome
          -Dshaft.trace.viewer.screenshot=target/trace-viewer-browser-acceptance.png
          -Dallure.automaticallyOpen=false
          -Dtelemetry.enabled=false
          test
      - name: Upload offline trace viewer coverage
        if: always()
        uses: ./.github/actions/upload-jacoco-coverage
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          required-files: ./shaft-engine/target/jacoco/jacoco.xml
          source-id: trace-viewer-offline-chromium
