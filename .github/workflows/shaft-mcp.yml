name: shaft-mcp

on:
  schedule:
    - cron: '00 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shaft-mcp-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-script-tests:
    name: Installer script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
    steps:
      # .memory relation filenames exceed MAX_PATH with the runner workspace prefix;
      # without long paths, git checkout itself fails on Windows runners.
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: 'zulu'
          check-latest: true
      - name: Run isolated installer script verification
        run: python scripts/ci/verify_shaft_mcp_installer_release.py

  package-and-smoke:
    needs: installer-script-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim disk space
        uses: ./.github/actions/reclaim-disk-space
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: 'zulu'
          check-latest: true
      - name: Set up Maven
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: 3.9.12
      - name: Validate reactor versions
        run: |
          python3 scripts/ci/validate_reactor_versions.py
          python3 scripts/ci/validate_shaft_mcp_configuration.py
      - name: Run MCP module tests
        env:
          MCP_RELATED_TESTS: ShaftMcpApplicationTests#contextRegistersExpectedLeanMcpToolApi,CaptureServiceTest#codeBlocksToolGeneratesReusableReplaySnippetsInsideWorkspace,CaptureServiceTest#checkpointToolRequiresActiveCaptureSession,CaptureServiceTest#codeBlocksRejectSessionOutsideWorkspace,DoctorServiceTest#toolAnalyzesAllowlistedEvidenceOffline,DoctorServiceTest#documentedExternalClientsInvokeDoctorAnalyzeWithoutCredentials,DoctorServiceTest#failedAllureAnalysisRejectsPathsOutsideWorkspace,DoctorServiceTest#draftPublicationRequiresExplicitApprovalBeforeReadingManifest,MobileRecordingServiceTest#recordingGeneratesRedactedReplayCodeInsideWorkspace,MobileRecordingServiceTest#recordingCodeBlocksRejectPathOutsideWorkspace,ShaftProjectServiceTest
        run: >-
          mvn --batch-mode -pl shaft-mcp -am test
          -Dtest="${MCP_RELATED_TESTS}"
          -Dsurefire.failIfNoSpecifiedTests=false
          -DheadlessExecution=true
          -Dgpg.skip
      - name: Upload coverage to Codecov
        if: always()
        uses: ./.github/actions/upload-jacoco-coverage
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            ./target/jacoco/jacoco.xml,
            ./shaft-engine/target/jacoco/jacoco.xml,
            ./shaft-mcp/target/jacoco/jacoco.xml
          required-files: ./shaft-mcp/target/jacoco/jacoco.xml
      - name: Verify MCP Allure results
        run: test -n "$(find shaft-mcp/allure-results -name '*-result.json' -type f -print -quit)"
      - name: Package and smoke transports
        uses: ./.github/actions/mcp-jar-build
        with:
          install-args: -pl shaft-mcp -am install
      - name: Validate shaft-mcp transports
        run: python3 scripts/ci/validate_shaft_mcp_transports.py
      - name: Build and smoke container
        uses: ./.github/actions/mcp-container-smoke
        with:
          image-tag: shaft-mcp:test
          container-name: shaft-mcp-smoke

  notify:
    name: Notify on nightly failure
    needs: [installer-script-tests, package-and-smoke]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: File or recover the nightly tracking issue
        uses: ./.github/actions/notify-nightly-failure
        with:
          outcome: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'skip' || 'success') }}
          workflow-name: ${{ github.workflow }}
          label: 'nightly-failure:shaft-mcp'
