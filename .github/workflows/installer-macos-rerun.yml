name: Installer macOS opt-in rerun

# Issue #6208: PR Gate ignores label events (#6190), and its `changes` job reads
# live opt-in labels. Adding one used to need a push or a manual "Re-run all
# jobs"; this workflow re-runs the newest PR Gate run for the head commit
# (cancelling it first if it is still running). The fresh-installer labels
# moved with ChaosEngine (#8057) and do not restart this gate. Fork pull
# requests receive a read-only token; maintainers re-run by hand there.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: installer-macos-rerun-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rerun:
    name: Re-run PR Gate for a live opt-in label
    if: contains(fromJSON('["ci:full","ci:capture-e2e","ci:intellij-verify","ci:cli-windows"]'), github.event.label.name) && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - name: Re-run PR Gate for the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/rerun_pr_gate_on_label.py --repo "$GITHUB_REPOSITORY" --head-sha "$HEAD_SHA"
