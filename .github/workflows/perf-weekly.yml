name: Performance weekly

# #7009: JMH hot-path benchmarks (benchmarks/jmh, not a reactor module), weekly, off
# the PR path. Compares against the previous successful run's result; a >15%
# regression opens (or comments on) one tracker issue.

on:
  schedule:
    - cron: '53 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-weekly
  cancel-in-progress: false

jobs:
  jmh:
    name: JMH
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: 'zulu'
          check-latest: true
      - name: Cache Maven repository
        uses: ./.github/actions/cache-maven-repo
      - name: Build shaft-engine and benchmarks
        run: |
          mvn --batch-mode --no-transfer-progress -pl shaft-engine -am install -DskipTests -Dmaven.javadoc.skip -Dgpg.skip -Dcyclonedx.skip
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          mvn --batch-mode --no-transfer-progress -f benchmarks/jmh/pom.xml package -DskipTests "-Dshaft.version=$version"
      - name: Run benchmarks
        run: java -jar benchmarks/jmh/target/benchmarks.jar -rf json -rff jmh-result.json | tail -n 20 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Download previous baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          prev=$(gh run list -R "$REPO" --workflow perf-weekly.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$prev" ] && gh run download "$prev" -R "$REPO" -n jmh-result -D baseline || echo "no baseline yet"
      - name: Compare
        id: compare
        run: python3 scripts/ci/jmh_compare.py baseline/jmh-result.json jmh-result.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jmh-result
          path: jmh-result.json
          if-no-files-found: ignore
      - name: Open or update the regression tracker
        if: failure() && steps.compare.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="JMH performance regression"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still regressed: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "Weekly JMH run found a >15% regression vs the previous run (#7009): ${RUN_URL}"
          fi
