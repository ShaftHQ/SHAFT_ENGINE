name: Fuzz weekly

# #7012 / #7042: time-boxed Jazzer run per parser target, weekly, off the PR path
# (the PR gate only replays fixed seeds via ParserFuzzSeedsUnitTest). A crash
# uploads the reproducer and opens (or comments on) one tracking issue per target.

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-weekly
  cancel-in-progress: false

env:
  JAZZER_VERSION: v0.30.0
  JAZZER_SHA256: 6eeaf0026d75599b07527d93b576593ce847cfca8b337a579971a5a9cdf792d0

jobs:
  fuzz:
    name: Jazzer ${{ matrix.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target: [ShardSpecFuzzer, PermissionOriginFuzzer, AriaSnapshotFuzzer]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: 'zulu'
          check-latest: true
      - name: Cache Maven repository
        uses: ./.github/actions/cache-maven-repo
      - name: Build test classes and classpath
        run: |
          mvn --batch-mode --no-transfer-progress -pl shaft-engine -am install -DskipTests -Dmaven.javadoc.skip -Dgpg.skip -Dcyclonedx.skip
          mvn --batch-mode --no-transfer-progress -pl shaft-engine test-compile dependency:build-classpath -Dmdep.outputFile=cp.txt -Dmdep.includeScope=test
      - name: Install Jazzer (checksum-verified)
        run: |
          curl -fsSL -o jazzer.tgz "https://github.com/CodeIntelligenceTesting/jazzer/releases/download/${JAZZER_VERSION}/jazzer-linux-x86-64.tar.gz"
          echo "${JAZZER_SHA256}  jazzer.tgz" | sha256sum --check --strict
          mkdir -p jazzer && tar -xzf jazzer.tgz -C jazzer
      - name: Fuzz
        id: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p corpus crashes
          cp="shaft-engine/target/test-classes:shaft-engine/target/classes:$(cat shaft-engine/cp.txt)"
          ./jazzer/jazzer --cp="$cp" --target_class="com.shaft.fuzz.${TARGET}" \
            -max_total_time=900 -artifact_prefix=crashes/ corpus 2>&1 | tail -n 40 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload reproducer
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: crashes/
          if-no-files-found: ignore
      - name: Open or update the tracking issue
        if: failure() && steps.fuzz.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Fuzz crash: ${TARGET}"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still crashing: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "Weekly Jazzer run found a crash in \`com.shaft.fuzz.${TARGET}\` (#7012). Reproducer artifact: ${RUN_URL}"
          fi
