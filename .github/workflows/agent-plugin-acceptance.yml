name: Agent Plugin Live Acceptance

on:
  schedule:
    - cron: '15 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-plugin-live-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-harness-full:
    name: Full deterministic harness
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install managed CI Python dependencies
        run: python -m pip install --no-deps --requirement requirements-ci.txt --quiet
      - name: Run exhaustive deterministic harness suites
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            tests.scripts.test_chaos_engine_runtime
            tests.scripts.test_agent_harness_adherence
            tests.scripts.test_agent_harness_portability
            tests.scripts.test_agent_harness_reachability
            tests.scripts.test_agent_plugin_client_smoke
            tests.scripts.test_agent_plugin_release
            tests.scripts.test_agent_router_contract
            tests.scripts.test_agnix_conformance
            tests.scripts.test_assemble_chaos_engine_plugin
            tests.scripts.test_assemble_shaft_skills_plugin
            tests.scripts.test_build_retry
            tests.scripts.test_chaos_engine_bootstrap
            tests.scripts.test_chaos_engine_dependencies
            tests.scripts.test_chaos_engine_generation_runtime
            tests.scripts.test_chaos_engine_hook
            tests.scripts.test_chaos_engine_hosts
            tests.scripts.test_chaos_engine_installer
            tests.scripts.test_chaos_engine_kernel
            tests.scripts.test_chaos_engine_learning
            tests.scripts.test_chaos_engine_live_installer_acceptance
            tests.scripts.test_chaos_engine_promotion
            tests.scripts.test_chaos_engine_portable_core
            tests.scripts.test_chaos_engine_research
            tests.scripts.test_delivery_status
            tests.scripts.test_extract_allure_failures
            tests.scripts.test_github_client
            tests.scripts.test_graphify_maintenance
            tests.scripts.test_guard_external_corpus
            tests.scripts.test_guard_lifecycle
            tests.scripts.test_guard_memory_worktree
            tests.scripts.test_guard_nul_corruption
            tests.scripts.test_harness_pr_gate
            tests.scripts.test_intellij_recording_powershell
            tests.scripts.test_issue_filing
            tests.scripts.test_knowledge_stores
            tests.scripts.test_planning_contract
            tests.scripts.test_pr_audit
            tests.scripts.test_repository_context
            tests.scripts.test_resolve_graph_out
            tests.scripts.test_resolve_mempalace
            tests.scripts.test_shaft_knowledge_refresh
            tests.scripts.test_shaft_skill_candidate_intake
            tests.scripts.test_shaft_skill_cli_examples
            tests.scripts.test_shaft_skill_quality
            tests.scripts.test_shaft_skill_routing_eval
            tests.scripts.test_shaft_skills_content
            tests.scripts.test_sync_user_harness
            tests.scripts.test_validate_agent_guidance
            tests.scripts.test_validate_chaos_engine_readme
            tests.scripts.test_validate_agent_ownership
            tests.scripts.test_validate_agent_plugins
            tests.scripts.test_validate_agent_setup
            tests.scripts.test_validate_skills
            tests.scripts.test_validate_workflow_timeouts
            tests.scripts.test_watch_pr_checks
            tests.scripts.test_worktree_hygiene
            tests.scripts.test_session_worktree
          )
          for module in "${modules[@]}"; do
            python -m unittest "$module" -v
          done
      - name: Validate full harness aggregation
        run: |
          python scripts/ci/validate_agent_setup.py --skip-external

  chaos-engine-cross-platform:
    name: ChaosEngine installer acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run full fresh-install, upgrade, dependency, and rollback acceptance
        run: >-
          python -m unittest
          tests.scripts.test_chaos_engine_bootstrap
          tests.scripts.test_chaos_engine_dependencies
          tests.scripts.test_chaos_engine_installer
          tests.scripts.test_chaos_engine_install_wrappers
          -v

  chaos-engine-live-installer:
    name: Live immutable installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run real fresh, offline, upgrade, repair, and rollback sequence
        run: >-
          python scripts/ci/chaos_engine_live_installer_acceptance.py
          --candidate-sha ${{ github.sha }}
          --base-sha "$(git rev-parse HEAD^)"
          --output chaos-engine-live-installer-evidence.json
      - name: Upload live installer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-engine-live-installer-${{ matrix.os }}
          path: chaos-engine-live-installer-evidence.json
          if-no-files-found: error
          retention-days: 4

  harness-platform-contracts:
    name: Harness platform contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run platform-sensitive harness contracts
        run: >-
          python -m unittest
          tests.scripts.test_build_retry
          tests.scripts.test_extract_allure_failures
          tests.scripts.test_intellij_recording_powershell
          -v

  agnix-conformance:
    name: Pinned agnix conformance
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Resolve pinned agnix contract
        run: python scripts/ci/agnix_conformance.py --github-env "$GITHUB_ENV"
      - name: Verify and run pinned agnix
        shell: bash
        run: |
          set -euo pipefail
          trial_root="$RUNNER_TEMP/shaft-agnix"
          mkdir -p "$trial_root/candidate" "$trial_root/evaluation" "$trial_root/output"
          printf '%s\n' '{"accepted":false,"external_blocker":"agnix setup did not complete"}' > agnix-conformance-evidence.json
          curl --fail --show-error --silent --location "$AGNIX_ARTIFACT_URL" --output "$trial_root/agnix.tar.gz"
          echo "$AGNIX_ARTIFACT_SHA256  $trial_root/agnix.tar.gz" | sha256sum --check
          test "$(tar -tzf "$trial_root/agnix.tar.gz")" = 'agnix'
          tar -xzf "$trial_root/agnix.tar.gz" -C "$trial_root/candidate"
          curl --fail --show-error --silent --location "$AGNIX_EVALUATION_URL" --output "$trial_root/evaluation.tar.gz"
          echo "$AGNIX_EVALUATION_SHA256  $trial_root/evaluation.tar.gz" | sha256sum --check
          tar -xzf "$trial_root/evaluation.tar.gz" -C "$trial_root/evaluation" --strip-components=1
          test -f "$trial_root/evaluation/tests/eval.yaml"
          docker pull "$AGNIX_IMAGE_REFERENCE"
          test "${AGNIX_IMAGE_REFERENCE##*@}" = "$AGNIX_IMAGE_ID"
          docker image inspect "$AGNIX_IMAGE_REFERENCE" >/dev/null
          python scripts/ci/agnix_conformance.py \
            --stage-source . \
            --fixtures-root "$trial_root/fixtures"
          python scripts/ci/agnix_conformance.py \
            --candidate-root "$trial_root/candidate" \
            --fixtures-root "$trial_root/fixtures" \
            --evaluation-root "$trial_root/evaluation/tests" \
            --output-root "$trial_root/output" \
            --output agnix-conformance-evidence.json
      - name: Upload agnix conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agnix-conformance-evidence
          path: agnix-conformance-evidence.json
          if-no-files-found: error
          retention-days: 4

  external-guardrail-corpus:
    name: Pinned external guardrail corpus
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify and score pinned external guardrail corpus
        run: >-
          python scripts/ci/external_guardrail_corpus.py
          --output external-guardrail-corpus-evidence.json
      - name: Upload external guardrail evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-guardrail-corpus-evidence
          path: external-guardrail-corpus-evidence.json
          if-no-files-found: error
          retention-days: 4

  native-client-load:
    name: Claude and Codex live skill load
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install managed CI Python dependencies
        run: python -m pip install --no-deps --requirement requirements-ci.txt --quiet
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned native plugin clients
        run: npm install --global '@anthropic-ai/claude-code@2.1.223' '@openai/codex@0.146.0'
      - name: Collect live compatibility evidence
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/ci/agent_plugin_client_smoke.py --mode live
          --routing-corpus agent-plugins/shaft-skills/evals/cases.json
          --execution-budget-seconds 900
          --routing-budget-seconds 600
          --output agent-plugin-client-evidence.json
      - name: Upload structured compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-plugin-live-acceptance-evidence
          path: agent-plugin-client-evidence.json
          if-no-files-found: error
          retention-days: 4

  chaos-engine-promotion:
    name: Five-host promotion evaluator
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check protected promotion inputs
        id: promotion-preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAOS_ENGINE_BASELINE_REVISION: ${{ secrets.CHAOS_ENGINE_BASELINE_REVISION }}
          CHAOS_ENGINE_CANDIDATE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          source = Path("scripts/ci/chaos_engine_promotion.py")
          spec = importlib.util.spec_from_file_location("promotion_preflight", source)
          if spec is None or spec.loader is None:
              raise SystemExit("promotion evaluator could not be loaded")
          promotion = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(promotion)
          report = promotion.evaluate([], dict(os.environ))
          ready = not report["missingCredentialHosts"] and not report["missingRevisionVariants"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"ready={str(ready).lower()}\n")
          if not ready:
              Path("chaos-engine-promotion-evidence.json").write_text(
                  json.dumps(report, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              Path("chaos-engine-promotion-trial-status.json").write_text(
                  json.dumps(
                      {
                          "failureCode": "protected-inputs-unavailable",
                          "identity": "chaos-engine-promotion-trials",
                          "schemaVersion": 1,
                          "status": "Blocked",
                          "terminalReason": "blocked",
                      },
                      sort_keys=True,
                      separators=(",", ":"),
                  ) + "\n",
                  encoding="utf-8",
              )
              print("promotion remains blocked because protected evaluation inputs are unavailable")
          PY
      - name: Collect paired live trial receipts
        id: promotion-trials
        if: steps.promotion-preflight.outputs.ready == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAOS_ENGINE_BASELINE_REVISION: ${{ secrets.CHAOS_ENGINE_BASELINE_REVISION }}
          CHAOS_ENGINE_CANDIDATE_REVISION: ${{ github.sha }}
          CHAOS_ENGINE_BASELINE_CODEX_COMMAND: ${{ secrets.CHAOS_ENGINE_BASELINE_CODEX_COMMAND }}
          CHAOS_ENGINE_CANDIDATE_CODEX_COMMAND: ${{ secrets.CHAOS_ENGINE_CANDIDATE_CODEX_COMMAND }}
          CHAOS_ENGINE_BASELINE_CLAUDE_COMMAND: ${{ secrets.CHAOS_ENGINE_BASELINE_CLAUDE_COMMAND }}
          CHAOS_ENGINE_CANDIDATE_CLAUDE_COMMAND: ${{ secrets.CHAOS_ENGINE_CANDIDATE_CLAUDE_COMMAND }}
          CHAOS_ENGINE_BASELINE_GEMINI_COMMAND: ${{ secrets.CHAOS_ENGINE_BASELINE_GEMINI_COMMAND }}
          CHAOS_ENGINE_CANDIDATE_GEMINI_COMMAND: ${{ secrets.CHAOS_ENGINE_CANDIDATE_GEMINI_COMMAND }}
          CHAOS_ENGINE_BASELINE_GROK_COMMAND: ${{ secrets.CHAOS_ENGINE_BASELINE_GROK_COMMAND }}
          CHAOS_ENGINE_CANDIDATE_GROK_COMMAND: ${{ secrets.CHAOS_ENGINE_CANDIDATE_GROK_COMMAND }}
          CHAOS_ENGINE_BASELINE_COPILOT_COMMAND: ${{ secrets.CHAOS_ENGINE_BASELINE_COPILOT_COMMAND }}
          CHAOS_ENGINE_CANDIDATE_COPILOT_COMMAND: ${{ secrets.CHAOS_ENGINE_CANDIDATE_COPILOT_COMMAND }}
        run: >-
          python scripts/ci/chaos_engine_promotion_trials.py
          --output chaos-engine-promotion-receipts
          --status chaos-engine-promotion-trial-status.json
          --workers 10
          --timeout 90
      - name: Evaluate and enforce promotion thresholds
        if: ${{ always() && steps.promotion-preflight.outputs.ready == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAOS_ENGINE_BASELINE_REVISION: ${{ secrets.CHAOS_ENGINE_BASELINE_REVISION }}
          CHAOS_ENGINE_CANDIDATE_REVISION: ${{ github.sha }}
        run: >-
          python scripts/ci/chaos_engine_promotion.py
          --receipts chaos-engine-promotion-receipts
          --output chaos-engine-promotion-evidence.json
      - name: Upload secret-free promotion evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-engine-promotion-evidence
          path: |
            chaos-engine-promotion-evidence.json
            chaos-engine-promotion-trial-status.json
            chaos-engine-promotion-receipts
          if-no-files-found: error
          retention-days: 4
