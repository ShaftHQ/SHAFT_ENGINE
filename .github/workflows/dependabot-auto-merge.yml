name: Dependabot queue

# Schedule and workflow_dispatch only inventory merge-queue membership.
# They do not enable auto-merge, dequeue, or re-arm, and this file does not
# by itself re-enable a workflow GitHub has set to disabled_manually.
# Dependabot opened, reopened, and synchronize events enable auto-merge with
# BOT_TOKEN. GITHUB_TOKEN events start no workflows, so a queue entry created
# that way never runs merge_group checks and times out. Do not fall back to
# GITHUB_TOKEN. A dependabot-hold label skips enqueue. The enqueue job checks
# out the default branch only and never runs pull-request code. Required
# checks on the synthetic SHA are PR Gate Summary and Release-note governance.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-queue-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose merge queue
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout default branch for the diagnostic script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Inventory queue membership and required checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"
          export GH_REPO="$repo"
          echo "Open Dependabot PRs. null autoMergeRequest is not queue membership."
          gh pr list -R "$repo" --author 'app/dependabot' --state open --limit 50 \
            --json number,url,autoMergeRequest,mergeStateStatus
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          GH_REPO="$repo" gh api graphql \
            -F owner='{owner}' -F name='{repo}' \
            -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){mergeQueue(branch:"main"){entries(first:20){nodes{state enqueuedAt headCommit{oid} pullRequest{number url headRefOid author{login} autoMergeRequest{enabledAt}}}}}}}' \
            >"$tmp/queue.json"
          python3 scripts/ci/merge_queue_awaiting_checks_heal.py shas \
            --queue-json "$tmp/queue.json" >"$tmp/shas.txt"
          mkdir -p "$tmp/checks"
          while IFS= read -r queue_sha; do
            [ -n "$queue_sha" ] || continue
            case "$queue_sha" in
              *[!0-9a-fA-F]*) echo "::error::refusing non-hex queue sha"; exit 1 ;;
            esac
            echo "queue sha ${queue_sha} (not the pull request head)"
            GH_REPO="$repo" gh api "repos/${repo}/commits/${queue_sha}/check-runs?per_page=100" \
              --jq "{sha: \"${queue_sha}\", runs: [.check_runs[]? | {name: .name, sha: \"${queue_sha}\", conclusion: .conclusion}]}" \
              >"$tmp/checks/${queue_sha}.json" || exit 1
          done <"$tmp/shas.txt"
          python3 scripts/ci/merge_queue_awaiting_checks_heal.py diagnose \
            --queue-json "$tmp/queue.json" --checks-dir "$tmp/checks"

  enqueue:
    name: Enqueue Dependabot with BOT_TOKEN
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout default branch for the enqueue decision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Enable auto-merge when the decision is enqueue
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN}" ]; then
            echo "::error::BOT_TOKEN is required. GITHUB_TOKEN events start no merge_group workflows."
            exit 1
          fi
          repo="${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"
          pr="${PR_NUMBER:?PR_NUMBER is required}"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp" "${tmp}.queue"' EXIT
          GH_TOKEN="${BOT_TOKEN}" gh pr view "$pr" -R "$repo" \
            --json author,isDraft,mergeable,mergeStateStatus,labels,autoMergeRequest \
            >"$tmp"
          # gh 2.103.3 rejects mergeQueueEntry on pr view. Read it with GraphQL.
          # gh --jq prints an empty line for JSON null, which is not a value.
          queue="${tmp}.queue"
          GH_TOKEN="${BOT_TOKEN}" GH_REPO="$repo" gh api graphql \
            -F owner="${repo%%/*}" -F name="${repo#*/}" -F number="$pr" \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){mergeQueueEntry{state}}}}' \
            >"$queue"
          python3 - "$tmp" "$queue" <<'PY'
          import json, sys
          view_path, queue_path = sys.argv[1], sys.argv[2]
          with open(view_path, encoding="utf-8") as handle:
              document = json.load(handle)
          with open(queue_path, encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("errors"):
              raise SystemExit("queue membership query failed")
          pull = ((payload.get("data") or {}).get("repository") or {}).get("pullRequest")
          if not isinstance(pull, dict) or "mergeQueueEntry" not in pull:
              raise SystemExit("queue membership query missing mergeQueueEntry")
          document["mergeQueueEntry"] = pull.get("mergeQueueEntry")
          with open(view_path, "w", encoding="utf-8") as handle:
              json.dump(document, handle)
          PY
          decision="$(python3 scripts/ci/merge_queue_awaiting_checks_heal.py enqueue-decision --pr-json "$tmp")"
          echo "enqueue decision: ${decision}"
          case "${decision}" in
            enqueue)
              GH_TOKEN="${BOT_TOKEN}" gh pr merge "$pr" -R "$repo" --auto
              GH_TOKEN="${BOT_TOKEN}" gh pr view "$pr" -R "$repo" --json autoMergeRequest,state \
                --jq 'if (.autoMergeRequest != null) or (.state != "OPEN") then "armed" else error("auto-merge not armed") end'
              ;;
            skip:*)
              ;;
            *)
              echo "::error::unknown enqueue decision: ${decision}"
              exit 1
              ;;
          esac
