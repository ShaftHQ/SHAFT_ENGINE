name: OpenSSF Scorecard

# #7001: supply-chain posture (branch protection, pinning, token permissions,
# signed releases, SAST). Runs on push to main and weekly; results go to code
# scanning and the public Scorecard API (README badge). Off the PR path.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          sarif_file: results.sarif
          category: scorecard
