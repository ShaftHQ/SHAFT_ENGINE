name: Copilot Setup Steps

# Issue #6218 (owner-approved): Copilot cloud starts from a fresh clone with no
# ChaosEngine hook runtime. This setup job opens the pending research receipt
# before the agent's first project read. GitHub runs only the job named exactly
# `copilot-setup-steps`; the push/pull_request triggers validate edits here.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # #8057: the receipt shim moved to ShaftHQ/chaosengine-harness with the
      # ChaosEngine source; rewiring the Copilot cloud receipt is #8057 e2.
      - name: Note the ChaosEngine move
        run: echo "ChaosEngine moved to ShaftHQ/chaosengine-harness; no SHAFT-local research receipt."
