name: Upstream pin watch

# Compares this repository's CI and build runtime pins (workflow
# setup-* versions, .sdkmanrc, pom.xml JDK) with the latest stable upstream.
# Opens or updates one issue when a pin is behind. ChaosEngine's dependency
# pins moved to ShaftHQ/chaosengine-harness (#8057), so there are no linked
# installer pins to rewrite here. Does not install tools.

on:
  schedule:
    # Weekly Monday 09:15 UTC, after the 08:00 Selenium pin job.
    - cron: '15 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-pin-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Compare repository pins to stable upstream
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci/watch_upstream_pins.py --write
