name: E2E Tests

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '00 1 * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: >-
          Comma-separated job names to run, no spaces (e.g. "Ubuntu_APIs" or
          "Ubuntu_APIs,Ubuntu_Database"). Defaults to every job -- today's
          behaviour -- and is always every job on the scheduled nightly run.
        required: false
        default: 'all'
      tests:
        description: >-
          Maven -Dtest= selector, threaded into every selected job's Run
          tests step. Leave empty to keep each selected job's own default
          selector unchanged.
        required: false
        default: ''
      enableFlutterEmulatorE2E:
        description: >-
          Opt-in flag for the Android_Flutter_Emulator_E2E job (issue #4197).
          Renamed from enableFlutterE2E (issue #4294) to stop colliding in
          name with the unrelated -Dshaft.enableFlutterE2E Maven system
          property that gates FlutterTest.java (FlutterTest.java:24,31-36).
          #4303 briefly hardcoded that property true in Android_Native_BrowserStack;
          reverted back to self-skip by the fix for issue #4308 (the checked-in
          flutter-demo.apk was never actually built with the required Flutter
          Integration Driver server -- see issue #4313 for the real fix). The
          rename stands regardless, so this input still only ever means one
          thing: opt in to THIS emulator smoke-check job. This job never runs
          on the nightly schedule (schedule triggers can't supply inputs); set
          to 'true' on a manual dispatch to run it. It only proves an Appium
          session opens against the real, pinned demo-app on an emulator -- it
          does not run FlutterTest.java and does not exercise the fluent
          Flutter API (see job comment).
        required: false
        default: 'false'

permissions:
  contents: read

env:
  # The env-dependent-unit-tests trailer below (issue #3935) excludes tests that are
  # genuinely environment-independent (Mockito-mocked, no real driver/grid/network) but were
  # riding along in these browser-matrix jobs anyway because this scope was previously an
  # unfiltered "everything except this short blocklist" selector. testPackage.unitTests is
  # excluded as a whole package because it already has a dedicated home in pr-gate.yml's
  # unit-tests job; the individual com.shaft.**.internal.*UnitTest classes (plus two
  # non-suffixed classes flagged by the S2/#3928 fix, PR #3936, as environment-coupling
  # risks) are excluded by name and now run in that same pr-gate.yml job instead.
  # The playwright/PlaywrightActionsE2ETest trailer (issue #4006) excludes
  # testPackage.playwright.*PlaywrightActionsE2ETest classes because they already have
  # dedicated coverage in the Ubuntu_Playwright_Chrome/Edge/WebKit/Firefox/GalaxyS26Ultra/
  # IPhone17ProMax jobs below, which invoke each class directly by name and install its
  # required browser. Without this exclusion the same GLOBAL_TESTING_SCOPE selector is also
  # reused by the native Selenium Grid jobs (Ubuntu_Firefox_Grid, Ubuntu_Chrome_Grid,
  # Ubuntu_MicrosoftEdge_Grid), which set -DexecutionAddress=http://localhost:4444 and never
  # install Playwright browsers, so the Playwright classes fail there with unresolvable
  # host.docker.internal fixture hosts and missing browser installs.
  # The LazyLoadingFixtureLiveTest trailer (issue #4038) excludes that single class because
  # its own Javadoc declares it local, headless-Chrome, timing-calibrated, singleThreaded =
  # true -- never designed to run against a remote Grid. It already has matching coverage in
  # e2eLocalTests.yml's Windows_Chrome_Local/MacOSX_Chrome_Local jobs (both -DexecutionAddress=
  # local, -DtargetBrowserName=chrome, -DheadlessExecution=true, -DsetParallelMode=NONE), where
  # GLOBAL_TESTING_SCOPE picks it up unexcluded and it passes. Left unexcluded here it also
  # runs in the native Selenium Grid jobs (Ubuntu_Chrome_Grid, Ubuntu_MicrosoftEdge_Grid),
  # where the extra remote-dispatch/network latency doesn't leave the readiness wait enough
  # margin for the fixture's in-flight delayed fetch, failing the assertion consistently.
  GLOBAL_TESTING_SCOPE: "!%regex[.*DatabaseActions.*], !%regex[.*CLI.*], !%regex[.*DB.*], !%regex[.*Db.*], !%regex[.*db.*], !%regex[.*API.*], !%regex[.*Api.*], !%regex[.*api.*], !%regex[.*uestBuilder.*], !%regex[.*Rest.*], !%regex[.*Json.*], !%regex[.*JSON.*], !%regex[.*json.*], !%regex[.*ndroid.*], !%regex[.*IOS.*], !%regex[.*MobileWeb.*], !%regex[.*appium.Mobile.*], !%regex[.*properties.Mobile.*], !%regex[.*CucumberTests.*], !%regex[.*LT.*], !%regex[.*Flutter.*], !%regex[.*MoonTests.*], !%regex[.*playwright.*PlaywrightActionsE2ETest.*], !%regex[.*LazyLoadingFixtureLiveTest.*], !%regex[.*testPackage.unitTests.*], !%regex[.*DriverFactoryHelperAugmentationUnitTest.*], !%regex[.*DriverFactoryHelperCoverageUnitTest.*], !%regex[.*DriverFactoryHelperStorageStateUnitTest.*], !%regex[.*OptionsManagerCoverageUnitTest.*], !%regex[.*RemoteGridPreflightUnitTest.*], !%regex[.*ActionsCoverageUnitTest.*], !%regex[.*ActionsExceptionDetailsUnitTest.*], !%regex[.*ElementInformationCoverageUnitTest.*], !%regex[.*ElementsHelperCoverageUnitTest.*], !%regex[.*AriaSnapshotHelperUnitTest.*], !%regex[.*MobileAccessibilityTreeConverterUnitTest.*], !%regex[.*AnimatedGifManagerCoverageUnitTest.*], !%regex[.*ImageProcessingActionsReportingUnitTest.*], !%regex[.*ImageProcessingActionsScreenshotBaselineUnitTest.*], !%regex[.*ScreenshotHelperCoverageUnitTest.*], !%regex[.*ScreenshotManagerCoverageUnitTest.*], !%regex[.*LocatorHealthReporterUnitTest.*], !%regex[.*RecordManagerCoverageUnitTest.*], !%regex[.*PlaywrightSessionFactoryStorageStateUnitTest.*], !%regex[.*PlaywrightNaturalActionExecutorTest.*], !%regex[.*ShardPartitionerUnitTest.*], !%regex[.*UpdateCheckerUnitTest.*], !%regex[.*LightHouseGenerateReportCoverageUnitTest.*], !%regex[.*PropertiesHelperDownloadRetryUnitTest.*], !%regex[.*PropertyFileManagerInternalUnitTest.*], !%regex[.*AllureManagerCoverageUnitTest.*], !%regex[.*BrowserPerformanceExecutionReportUnitTest.*], !%regex[.*FlakeProfilerUnitTest.*], !%regex[.*ProgressBarLoggerCoverageUnitTest.*], !%regex[.*ValidationsHelperCoverageUnitTest.*], !%regex[.*ValidationsHelperNewPatternCoverageUnitTest.*], !%regex[.*VisualValidationsBuilderUnitTest.*], !%regex[.*WebDriverElementValidationsBuilderAriaSnapshotUnitTest.*], !%regex[.*WebDriverElementValidationsBuilderCoverageUnitTest.*], !%regex[.*AssertionEvidenceReporterTest.*], !%regex[.*FailureTraceReporterTest.*]"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  Workflow_Summary:
    if: always()
    needs:
      - Ubuntu_Database
      - Ubuntu_APIs
      - Ubuntu_Visual_Module
      - Ubuntu_Desktop_Video_Module
      - Ubuntu_Firefox_Grid
      - Ubuntu_Chrome_Grid
      - Ubuntu_MicrosoftEdge_Grid
      - Ubuntu_Playwright_Chrome
      - Ubuntu_Playwright_Edge
      - Ubuntu_Playwright_WebKit
      - Ubuntu_Playwright_Firefox
      - Ubuntu_Playwright_GalaxyS26Ultra
      - Ubuntu_Playwright_IPhone17ProMax
      - Android_Native_BrowserStack
      - Android_Visual_Ocr_BrowserStack
      - iOS_Visual_Ocr_BrowserStack
      - Android_Recording_BrowserStack
      - iOS_Recording_BrowserStack
      - Android_Evidence_BrowserStack
      - iOS_Evidence_BrowserStack
      - iOS_Web_SAFARI_BrowserStack
      - Android_Web_Chrome_BrowserStack
      - Android_Flutter_Emulator_E2E
      - MacOSX_Safari_BrowserStack
      - Ubuntu_Chrome_Cucumber_Grid
      - MacOSX_Safari_Cucumber_BrowserStack
      - Ubuntu_JUnit_E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Consolidate Test Results
        uses: ./.github/actions/consolidate-test-results
        with:
          needs-json: ${{ toJSON(needs) }}

  Ubuntu_Database:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.jobs == '' || github.event.inputs.jobs == 'all' || contains(format(',{0},', github.event.inputs.jobs), ',Ubuntu_Database,')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      job: ${{ steps.post_test_report.outputs.job }}
      total: ${{ steps.post_test_report.outputs.total }}
      passed: ${{ steps.post_test_report.outputs.passed }}
      failed: ${{ steps.post_test_report.outputs.failed }}
      broken: ${{ steps.post_test_report.outputs.broken }}
      skipped: ${{ steps.post_test_report.outputs.skipped }}
      duration: ${{ steps.post_test_report.outputs.duration }}
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Connect to PostgreSQL
        run: |
            cd shaft-engine/src/main/resources/docker-compose/postgres/
            npm install pg
            node client.js
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
      - name: Setup Test Environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: '20'
      - name: Run tests
        continue-on-error: true
        run: mvn -pl shaft-engine -am -e test "-DretryMaximumNumberOfAttempts=2" "-DgenerateAllureReportArchive=true" "-Dtest=${{ github.event.inputs.tests != '' && github.event.inputs.tests || '%regex[.*DatabaseActions.*], %regex[.*DB.*], %regex[.*Db.*], %regex[.*db.*]' }}"
      - name: Post-Test Report and Check
        id: post_test_report
        if: always()
        uses: ./.github/actions/post-test-report
        with:
          job-name: Ubuntu_Database
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  Ubuntu_APIs:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.jobs == '' || github.event.inputs.jobs == 'all' || contains(format(',{0},', github.event.inputs.jobs), ',Ubuntu_APIs,')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      job: ${{ steps.post_test_report.outputs.job }}
      total: ${{ steps.post_test_report.outputs.total }}
      passed: ${{ steps.post_test_report.outputs.passed }}
      failed: ${{ steps.post_test_report.outputs.failed }}
      broken: ${{ steps.post_test_report.outputs.broken }}
      skipped: ${{ steps.post_test_report.outputs.skipped }}
      duration: ${{ steps.post_test_report.outputs.duration }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Test Environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: '20'
      - name: Run tests
        continue-on-error: true
        run: mvn -pl shaft-engine -am -e test "-DdefaultElementIdentificationTimeout=5" "-DretryMaximumNumberOfAttempts=2" "-DgenerateAllureReportArchive=true" "-Dtest=${{ github.event.inputs.tests != '' && github.event.inputs.tests || '%regex[.*API.*], %regex[.*Api.*], %regex[.*PathParamTest.*], %regex[.*SwaggerContractTest.*], %regex[.*uestBuilder.*], %regex[.*Rest.*], %regex[.*Json.*], %regex[.*JSON.*], %regex[.*json.*], %regex[.*YAML.*], %regex[.*Yaml.*], %regex[.*yaml.*], %regex[.*CLIWizard.*], %regex[.*TerminalActions.*], %regex[.*properties.Mobile.*], %regex[.*CSVFileManagerUnitTest.*], %regex[.*PdfFileManager.*], %regex[.*ExcelFileManager.*]' }}"
      - name: Post-Test Report and Check
        id: post_test_report
        if: always()
        uses: ./.github/actions/post-test-report
        with:
          job-name: Ubuntu_APIs
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  Ubuntu_Visual_Module:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.jobs == '' || github.event.inputs.jobs == 'all' || contains(format(',{0},', github.event.inputs.jobs), ',Ubuntu_Visual_Module,')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      job: ${{ steps.post_test_report.outputs.job }}
      total: ${{ steps.post_test_report.outputs.total }}
      passed: ${{ steps.post_test_report.outputs.passed }}
      failed: ${{ steps.post_test_report.outputs.failed }}
      broken: ${{ steps.post_test_report.outputs.broken }}
      skipped: ${{ steps.post_test_report.outputs.skipped }}
      duration: ${{ steps.post_test_report.outputs.duration }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Test Environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: '20'
      - name: Run visual module tests
        continue-on-error: true
        run: mvn -pl shaft-visual -am -e test "-DretryMaximumNumberOfAttempts=1" "-DgenerateAllureReportArchive=true" "-Dtest=${{ github.event.inputs.tests != '' && github.event.inputs.tests || 'ImageProcessingActionsUnitTest' }}"
      - name: Post-Test Report and Check
        id: post_test_report
        if: always()
        uses: ./.github/actions/post-test-report
        with:
          job-name: Ubuntu_Visual_Module
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          module-directory: shaft-visual

  Ubuntu_Desktop_Video_Module:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.jobs == '' || github.event.inputs.jobs == 'all' || contains(format(',{0},', github.event.inputs.jobs), ',Ubuntu_Desktop_Video_Module,')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      job: ${{ steps.post_test_report.outputs.job }}
      total: ${{ steps.post_test_report.outputs.total }}
      passed: ${{ steps.post_test_report.outputs.passed }}
      failed: ${{ steps.post_test_report.outputs.failed }}
      broken: ${{ steps.post_test_report.outputs.broken }}
      skipped: ${{ steps.post_test_report.outputs.skipped }}
      duration: ${{ steps.post_test_report.outputs.duration }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Test Environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: '20'
      - name: Run desktop video module tests
        continue-on-error: true
        run: mvn -pl shaft-video -am -e test "-DretryMaximumNumberOfAttempts=1" "-DgenerateAllureReportArchive=true" "-Dtest=${{ github.event.inputs.tests != '' && github.event.inputs.tests || 'DesktopVideoRecordingProviderRegistrationTest' }}"
      - name: Post-Test Report and Check
        id: post_test_report
        if: always()
        uses: ./.github/actions/post-test-report
        with:
          job-name: Ubuntu_Desktop_Video_Module
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          module-directory: shaft-video

  # Native Selenium Grid jobs start selenium4.yml before Maven. Do not pass -am on
  # Run tests: shaft-infrastructure is JUnit and ignores TestNG GLOBAL_TESTING_SCOPE,
  # so -am would execute SeleniumGridLifecycleServiceTest against the already-running
  # Grid (issue #5092). Dependencies are installed by the visual-runtime step
  # (`mvn -pl shaft-visual -am install -DskipTests`).
  Ubuntu_Firefox_Grid:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.jobs == '' || github.event.inputs.jobs == 'all' || contains(format(',{0},', github.event.inputs.jobs), ',Ubuntu_Firefox_Grid,')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      job: ${{ steps.post_test_report.outputs.job }}
      total: ${{ steps.post_test_report.outputs.total }}
      passed: ${{ steps.post_test_report.outputs.passed }}
      failed: ${{ steps.post_test_report.outputs.failed }}
      broken: ${{ steps.post_test_report.outputs.broken }}
      skipped: ${{ steps.post_test_report.outputs.skipped }}
      duration: ${{ steps.post_test_report.outputs.duration }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Native Selenium Grid
        run: docker compose -f shaft-engine/src/main/resources/docker-compose/selenium4.yml up --scale chrome=0 --scale edge=0 --scale firefox=10 -d
      - name: Setup Test Environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: '20'
      - name: Check running containers
        run: docker ps
      # Wrapped because this step, not `Run tests`, is where a cold cache pays:
      # it has no continue-on-error, so a Central refusal here skips `Run tests`
      # and `Post-Test Report and Check` then fails on a missing Allure summary
      # (issue #4445, run 30876948089). The retry is a fresh process; Maven's
      # own in-JVM retries had already spent 6m05s losing to the same 429.
      - name: Install optional visual test runtime
        shell: bash
        run: >-
          bash scripts/ci/build_retry.sh 2 60
          mvn -pl shaft-visual -am -e install "-DskipTests" "-Dgpg.skip" "-Dcyclonedx.skip"
      - name: Run tests
        continue-on-error: true
        run: mvn -pl shaft-engine -e test "-DincludeVisualTestRuntime" "-DdefaultElementIdentificationTimeout=5" "-DsetParallelMode=DYNAMIC" "-DsetParallel=METHODS" "-DretryMaximumNumberOfAttempts=2" "-DexecutionAddress=http://localhost:4444" "-DtargetOperatingSystem=LINUX" "-DtargetBrowserName=firefox" "-DheadlessExecution=true" "-DremotePreflightEnabled=true" "-DremoteAdaptiveSessionThrottling=true" "-DremotePreflightFailFast=true" "-DremoteServerConnectionAttemptTimeout=15" "-DgenerateAllureReportArchive=true" "-Dtest=${{ github.event.inputs.tests != '' && github.event.inputs.tests || '${GLOBAL_TESTING_SCOPE}' }}"
      - name: Post-Test Report and Check
        id: post_test_report
        if: always()
        uses: ./.github/actions/post-test-report
        with:
          job-name: Ubuntu_Firefox_Grid
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  Ubuntu_Chrome_Grid:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.jobs == '' || github.event.inputs.jobs == 'all' || contains(format(',{0},', github.event.inputs.jobs), ',Ubuntu_Chrome_Grid,')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      job: ${{ steps.post_test_report.outputs.job }}
      total: ${{ steps.post_test_report.outputs.total }}
      passed: ${{ steps.post_test_report.outputs.passed }}
      failed: ${{ steps.post_test_report.outputs.failed }}
      broken: ${{ steps.post_test_report.outputs.broken }}
      skipped: ${{ steps.post_test_report.outputs.skipped }}
      duration: ${{ steps.post_test_report.outputs.duration }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Native Selenium Grid
        run: docker compose -f shaft-engine/src/main/resources/docker-compose/selenium4.yml up --scale chrome=10 --scale edge=0 --scale firefox=0 -d
      - name: Setup Test Environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: '20'
      - name: Check running containers
        run: docker ps
      # Wrapped because this step, not `Run tests`, is where a cold cache pays:
      # it has no continue-on-error, so a Central refusal here skips `Run tests`
      # and `Post-Test Report and Check` then fails on a missing Allure summary
      # (issue #4445, run 30876948089). The retry is a fresh process; Maven's
      # own in-JVM retries had already spent 6m05s losing to the same 429.
      - name: Install optional visual test runtime
        shell: bash
        run: >-
          bash scripts/ci/build_retry.sh 2 60
          mvn -pl shaft-visual -am -e install "-DskipTests" "-Dgpg.skip" "-Dcyclonedx.skip"
      - name: Run tests
        continue-on-error: true
        run: mvn -pl shaft-engine -e test "-DincludeVisualTestRuntime" "-DdefaultElementIdentificationTimeout=5" "-DsetParallelMode=DYNAMIC" "-DsetParallel=METHODS" "-DretryMaximumNumberOfAttempts=2" "-DexecutionAddress=http://localhost:4444" "-DtargetOperatingSystem=LINUX" "-DtargetBrowserName=chrome" "-DheadlessExecution=true" "-DremotePreflightEnabled=true" "-DremoteAdaptiveSessionThrottling=true" "-DremotePreflightFailFast=true" "-DremoteServerConnectionAttemptTimeout=15" "-DgenerateAllureReportArchive=true" "-Dtest=${{ github.event.inputs.tests != '' && github.event.inputs.tests || '${GLOBAL_TESTING_SCOPE}' }}"
      - name: Post-Test Report and Check
        id: post_test_report
        if: always()
        uses: ./.github/actions/post-test-report
        with:
          job-name: Ubuntu_Chrome_Grid
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  Ubuntu_MicrosoftEdge_Grid:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.jobs == '' || github.event.inputs.jobs == 'all' || contains(format(',{0},', github.event.inputs.jobs), ',Ubuntu_MicrosoftEdge_Grid,')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      job: ${{ steps.post_test_report.outputs.job }}
      total: ${{ steps.post_test_report.outputs.total }}
      passed: ${{ steps.post_test_report.outputs.passed }}
      failed: ${{ steps.post_test_report.outputs.failed }}
      broken: ${{ steps.post_test_report.outputs.broken }}
      skipped: ${{ steps.post_test_report.outputs.skipped }}
      duration: ${{ steps.post_test_report.outputs.duration }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Native Selenium Grid
        run: docker compose -f shaft-engine/src/main/resources/docker-compose/selenium4.yml up --scale chrome=0 --scale edge=10 --scale firefox=0 -d
      - name: Setup Test Environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: '20'
      - name: Check running containers
        run: docker ps
      # Wrapped because this step, not `Run tests`, is where a cold cache pays:
      # it has no continue-on-error, so a Central refusal here skips `Run tests`
      # and `Post-Test Report and Check` then fails on a missing Allure summary
      # (issue #4445, run 30876948089). The retry is a fresh process; Maven's
      # own in-JVM retries had already spent 6m05s losing to the same 429.
      - name: Install optional visual test runtime
        shell: bash
        run: >-
          bash scripts/ci/build_retry.sh 2 60
          mvn -pl shaft-visual -am -e install "-DskipTests" "-Dgpg.skip" "-Dcyclonedx.skip"
      - name: Run tests
        continue-on-error: true
        run: mvn -pl shaft-engine -e test "-DincludeVisualTestRuntime" "-DdefaultElementIdentificationTimeout=5" "-DsetParallelMode=DYNAMIC" "-DsetParallel=METHODS" "-DretryMaximumNumberOfAttempts=2" "-DexecutionAddress=http://localhost:4444" "-DtargetOperatingSystem=LINUX" "-DtargetBrowserName=MicrosoftEdge" "-DheadlessExecution=true" "-DremotePreflightEnabled=true" "-DremoteAdaptiveSessionThrottling=true" "-DremotePreflightFailFast=true" "-DremoteServerConnectionAttemptTimeout=15" "-DgenerateAllureReportArchive=true" "-Dtest=${{ github.event.inputs.tests != '' && github.event.inputs.tests || '${GLOBAL_TESTING_SCOPE}' }}"
      - name: Post-Test Report and Check
        id: post_test_report
        if: always()
        uses: ./.github/actions/post-test-report
        with:
          job-name: Ubuntu_MicrosoftEdge_Grid
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  Ubuntu_Playwright_Chrome:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.jobs == '' || github.event.inputs.jobs == 'all' || contains(format(',{0},', github.event.inputs.jobs), ',Ubuntu_Playwright_Chrome,')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      job: ${{ steps.post_test_report.outputs.job }}
      total: ${{ steps.post_test_report.outputs.total }}
      passed: ${{ steps.post_test_report.outputs.passed }}
      failed: ${{ steps.post_test_report.outputs.failed }}
      broken: ${{ steps.post_test_report.outputs.broken }}
      skipped: ${{ steps.post_test_report.outputs.skipped }}
      duration: ${{ steps.post_test_report.outputs.duration }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Test Environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: '20'
      - name: Install Playwright Chrome
        shell: bash
        run: >-
          bash scripts/ci/build_retry.sh 2 60
          mvn -f shaft-engine/pom.xml -e org.codehaus.mojo:exec-maven-plugin:3.6.3:java "-Dexec.mainClass=com.microsoft.playwright.CLI" "-Dexec.args=install --with-deps chrome"
      - name: Run Playwright Chrome E2E
        continue-on-error: true
        run: mvn -pl shaft-engine -am -e test "-DdefaultElementIdentificationTimeout=5" "-DsetParallelMode=NONE" "-DretryMaximumNumberOfAttempts=1" "-DheadlessExecution=true" "-DgenerateAllureReportArchive=true" "-Dtest=${{ github.event.inputs.tests != '' && github.event.inputs.tests || 'ChromePlaywrightActionsE2ETest' }}"
      - name: Post-Test Report and Check
        id: post_test_report
        if: always()
        uses: ./.github/actions/post-test-report
        with:
          job-name: Ubuntu_Playwright_Chrome
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  Ubuntu_Playwright_Edge:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.jobs == '' || github.event.inputs.jobs == 'all' || contains(format(',{0},', github.event.inputs.jobs), ',Ubuntu_Playwright_Edge,')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      job: ${{ steps.post_test_report.outputs.job }}
      total: ${{ steps.post_test_report.outputs.total }}
      passed: ${{ steps.post_test_report.outputs.passed }}
      failed: ${{ steps.post_test_report.outputs.failed }}
