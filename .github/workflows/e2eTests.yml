      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Test Environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: 'lts/*'
      - name: Run tests
        continue-on-error: true
        run: mvn -pl shaft-browserstack -am -e test "-DdefaultElementIdentificationTimeout=5" "-DretryMaximumNumberOfAttempts=2" "-DexecutionAddress=browserstack" "-DtargetOperatingSystem=MAC" "-DtargetBrowserName=Safari" "-DmaximumPerformanceMode=1" "-DbrowserStack.os=OS X" "-DbrowserStack.osVersion=Sonoma" "-DbrowserStack.browserVersion=17.0" "-DgenerateAllureReportArchive=true" "-Dtest=${{ github.event.inputs.tests != '' && github.event.inputs.tests || '%regex[.*CucumberTests.*]' }}"
      # This job runs -pl shaft-browserstack -am like every other BrowserStack job in this
      # file (Android_Native_BrowserStack, iOS_Web_SAFARI_BrowserStack,
      # Android_Web_Chrome_BrowserStack, MacOSX_Safari_BrowserStack) -- and like them, its
      # -Dtest selector only matches classes that live in shaft-engine, not
      # shaft-browserstack (here: cucumberTestRunner.CucumberTests; find shaft-browserstack
      # -iname CucumberTests.java returns nothing). -am pulls shaft-engine into the reactor
      # as shaft-browserstack's own dependency and runs its test phase there, writing
      # allure-results/surefire output under shaft-engine/. None of the four sibling
      # BrowserStack jobs override module-directory -- they rely on the shaft-engine
      # default, and that default is correct here too. #4079 introduced a
      # `module-directory: shaft-browserstack` override unique to this job (matching the
      # -pl target instead of where output actually lands), which made the zero-result
      # guard below fire "No Allure summary was generated for shaft-browserstack" on a
      # fully passing run (issue #4119). require-coverage is left at its default (required)
      # for the same reason: the root pom's jacoco default-report execution is bound to the
      # `test` phase for every reactor module unconditionally (pom.xml's default-prepare-agent
      # / default-report executions), so shaft-engine/target/jacoco/jacoco.xml is produced
      # here exactly as it is for the sibling jobs, none of which set require-coverage either.
      - name: Post-Test Report and Check
        id: post_test_report
        if: always()
        uses: ./.github/actions/post-test-report
        with:
          job-name: MacOSX_Safari_Cucumber_BrowserStack
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  Ubuntu_JUnit_E2E:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.jobs == '' || github.event.inputs.jobs == 'all' || contains(format(',{0},', github.event.inputs.jobs), ',Ubuntu_JUnit_E2E,')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MOON_NAMESPACE: moon
      MOON_RELEASE: moon
      MOON_PORT: '4444'
      MOON_URL: http://localhost:4444/wd/hub
      MOON_CHART_VERSION: ''
    outputs:
      job: ${{ steps.post_test_report.outputs.job }}
      total: ${{ steps.post_test_report.outputs.total }}
      passed: ${{ steps.post_test_report.outputs.passed }}
      failed: ${{ steps.post_test_report.outputs.failed }}
      broken: ${{ steps.post_test_report.outputs.broken }}
      skipped: ${{ steps.post_test_report.outputs.skipped }}
      duration: ${{ steps.post_test_report.outputs.duration }}
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Create Kubernetes Kind Cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: moon
          wait: 120s

      - name: Verify Kubernetes Cluster
        shell: bash
        run: |
          set -euo pipefail
          kubectl cluster-info
          kubectl wait --for=condition=Ready nodes --all --timeout=120s
          kubectl get nodes -o wide

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4

      - name: Install Moon
        shell: bash
        run: |
          set -euo pipefail
          helm repo add aerokube https://charts.aerokube.com/
          helm repo update

          chart_args=(
            --create-namespace
            --namespace "${MOON_NAMESPACE}"
            --set deployment.replicas=1
            --set "deployment.moonCallbackURL=http://localhost:${MOON_PORT}"
          )
          if [ -n "${MOON_CHART_VERSION}" ]; then
            chart_args+=(--version "${MOON_CHART_VERSION}")
          fi

          helm upgrade --install "${MOON_RELEASE}" aerokube/moon2 "${chart_args[@]}"
          kubectl -n "${MOON_NAMESPACE}" rollout status "deployment/${MOON_RELEASE}" --timeout=5m
          kubectl -n "${MOON_NAMESPACE}" wait --for=condition=Available "deployment/${MOON_RELEASE}" --timeout=120s
          kubectl -n "${MOON_NAMESPACE}" get all -o wide

      - name: Forward Moon WebDriver Port
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "${MOON_NAMESPACE}" port-forward "service/${MOON_RELEASE}" "${MOON_PORT}:${MOON_PORT}" > moon-port-forward.log 2>&1 &
          echo "$!" > moon-port-forward.pid

          for attempt in {1..60}; do
            if ! kill -0 "$(cat moon-port-forward.pid)" 2>/dev/null; then
              cat moon-port-forward.log || true
              echo "::error::Moon port-forward process exited before endpoint became available."
              exit 1
            fi
            if curl --max-time 2 -fsS "${MOON_URL%/wd/hub}/status" >/dev/null; then
              curl --max-time 2 -fsS "${MOON_URL%/wd/hub}/status"
              exit 0
            fi
            sleep 1
          done

          cat moon-port-forward.log || true
          echo "::error::Timed out waiting for Moon WebDriver status endpoint."
          exit 1

      - name: Setup Test Environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: '20'

      - name: Enable JUnit Test Runtime
        shell: bash
        run: |
          mkdir -p shaft-engine/src/test/resources/META-INF/services
          rm -f shaft-engine/src/test/resources/META-INF/services/org.testng.ITestNGListener
          printf 'com.shaft.listeners.JunitListener\n' > shaft-engine/src/test/resources/META-INF/services/org.junit.platform.launcher.LauncherSessionListener
          printf 'com.shaft.listeners.JunitExtension\n' > shaft-engine/src/test/resources/META-INF/services/org.junit.jupiter.api.extension.Extension
          touch shaft-engine/src/test/resources/junit-platform.properties
          grep -qxF 'junit.jupiter.extensions.autodetection.enabled=true' shaft-engine/src/test/resources/junit-platform.properties \
            || printf '\njunit.jupiter.extensions.autodetection.enabled=true\n' >> shaft-engine/src/test/resources/junit-platform.properties

      - name: Run JUnit E2E Tests
        continue-on-error: true
        shell: bash
        run: |
          mvn -e -Pjunit -pl shaft-engine -am test \
            "-DskipTestNG=true" \
            "-DdefaultElementIdentificationTimeout=5" \
            "-DretryMaximumNumberOfAttempts=1" \
            "-DexecutionAddress=${MOON_URL}" \
            "-DtargetOperatingSystem=LINUX" \
            "-DtargetBrowserName=chrome" \
            "-DheadlessExecution=true" \
            "-DremoteServerInstanceCreationTimeout=10" \
            "-DremotePreflightEnabled=true" \
            "-DremoteAdaptiveSessionThrottling=true" \
            "-DremotePreflightFailFast=true" \
            "-DremoteServerConnectionAttemptTimeout=15" \
            "-DgenerateAllureReportArchive=true" \
            "-Dallure.automaticallyOpen=false" \
            "-Dallure.open=false" \
            "-Dtest=${{ github.event.inputs.tests != '' && github.event.inputs.tests || 'Junit*,MoonTests' }}"

      - name: Verify JUnit Test Results Exist
        if: always()
        shell: bash
        run: |
          RESULT_COUNT=$(find shaft-engine/allure-results -name '*-result.json' -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Allure result files: ${RESULT_COUNT}"
          if [ "${RESULT_COUNT}" -lt 10 ]; then
            echo "::error::Expected JUnit E2E tests to generate at least 10 Allure result files."
            exit 1
          fi

      - name: Collect Moon Diagnostics
        if: always()
        shell: bash
        run: |
          kubectl -n "${MOON_NAMESPACE}" get all || true
          kubectl -n "${MOON_NAMESPACE}" describe "deployment/${MOON_RELEASE}" || true
          kubectl -n "${MOON_NAMESPACE}" logs "deployment/${MOON_RELEASE}" -c moon --tail=200 || true
          kubectl -n "${MOON_NAMESPACE}" logs "deployment/${MOON_RELEASE}" -c moon-conf --tail=200 || true
          kubectl -n "${MOON_NAMESPACE}" logs "deployment/${MOON_RELEASE}" -c moon-ui --tail=200 || true
          cat moon-port-forward.log || true

      - name: Stop Moon Port Forward
        if: always()
        shell: bash
        run: |
          if [ -f moon-port-forward.pid ]; then
            kill "$(cat moon-port-forward.pid)" || true
          fi

      - name: Post-Test Report and Check
        id: post_test_report
        if: always()
        uses: ./.github/actions/post-test-report
        with:
          job-name: Ubuntu_JUnit_E2E
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  notify_e2e_tests_failure:
    name: Notify on nightly failure
    needs: [ Ubuntu_Database, Ubuntu_APIs, Ubuntu_Visual_Module, Ubuntu_Desktop_Video_Module, Ubuntu_Firefox_Grid, Ubuntu_Chrome_Grid, Ubuntu_MicrosoftEdge_Grid, Ubuntu_Playwright_Chrome, Ubuntu_Playwright_Edge, Ubuntu_Playwright_WebKit, Ubuntu_Playwright_Firefox, Ubuntu_Playwright_GalaxyS26Ultra, Ubuntu_Playwright_IPhone17ProMax, Android_Native_BrowserStack, Android_Visual_Ocr_BrowserStack, iOS_Visual_Ocr_BrowserStack, Android_Recording_BrowserStack, iOS_Recording_BrowserStack, Android_Evidence_BrowserStack, iOS_Evidence_BrowserStack, iOS_Web_SAFARI_BrowserStack, Android_Web_Chrome_BrowserStack, Android_Flutter_Emulator_E2E, MacOSX_Safari_BrowserStack, Ubuntu_Chrome_Cucumber_Grid, MacOSX_Safari_Cucumber_BrowserStack, Ubuntu_JUnit_E2E ]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: File or recover the nightly tracking issue
        uses: ./.github/actions/notify-nightly-failure
        with:
          # A targeted dispatch (github.event.inputs.jobs set to something other than
          # '' / 'all') only runs a subset of jobs on purpose (#4115) -- most needs.*.result
          # entries are 'skipped', not real passes, so this must never be read as a
          # full-suite recovery/failure signal. Only a schedule run or a full ('all'/empty)
          # dispatch feeds the real outcome into the tracking-issue logic below.
          outcome: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.jobs != '' && github.event.inputs.jobs != 'all') && 'skip' || (contains(needs.*.result, 'failure') && 'failure') || (contains(needs.*.result, 'cancelled') && 'skip') || 'success' }}
          workflow-name: ${{ github.workflow }}
          label: 'nightly-failure:e2e-tests'
