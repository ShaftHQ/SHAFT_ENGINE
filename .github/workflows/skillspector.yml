name: SkillSpector skill gate

# Static NVIDIA SkillSpector scan of ChaosEngine first-party skills (CE SkillSpector gate).
# Blocks score > 50 or any unsuppressed HIGH/CRITICAL. Baseline lives in
# scripts/ci/skillspector/.skillspector-baseline.yaml.

on:
  pull_request:
    paths:
      - 'chaos-engine/skills/**'
      - 'chaos-engine/addons/**'
      - 'chaos-engine/plugin-adapters/**'
      - 'scripts/ci/skillspector/**'
      - 'scripts/ci/skillspector_gate.py'
      - '.github/workflows/skillspector.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillspector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: SkillSpector static gate
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Read SkillSpector pin
        id: pin
        run: |
          commit=$(python3 -c 'import json; print(json.load(open("scripts/ci/skillspector/PIN.json"))["commit"])')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Install pinned SkillSpector
        env:
          PIN_COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install "git+https://github.com/NVIDIA/SkillSpector.git@${PIN_COMMIT}"
          skillspector --version

      - name: Changed skill paths (PR) or all (dispatch)
        id: paths
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/ss-changed.txt || true
          else
            : > /tmp/ss-changed.txt
          fi
          if [ ! -s /tmp/ss-changed.txt ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          else
            echo "mode=paths" >> "$GITHUB_OUTPUT"
          fi

      - name: Run SkillSpector gate
        env:
          CHAOS_SKILLSPECTOR_REQUIRED: '1'
          PATH: /home/runner/.local/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          if [ "${{ steps.paths.outputs.mode }}" = "all" ]; then
            python3 scripts/ci/skillspector_gate.py --root . --all --required
          else
            python3 scripts/ci/skillspector_gate.py --root . --paths-file /tmp/ss-changed.txt --required
          fi
