codecov:
  require_ci_to_pass: yes
  notify:
    # PR Gate Summary polls Codecov (#6990); waiting for CI would deadlock it.
    wait_for_ci: false

coverage:
  precision: 2
  round: down
  range: "1..100"

  status:
    # #6990 coverage layer: blocking statuses. Project may not drop more than
    # 0.5%; new/changed lines need 80%. Not ruleset-required (Codecov does not
    # report on merge_group); babysitting treats a red status as blocking and
    # the weekly quality report tracks drops on main.
    project:
      default:
        target: auto
        threshold: 0.5%
        informational: false
    patch:
      default:
        target: 80%
        informational: false

flag_management:
  default_rules:
    # Path-scoped PR legs upload only the modules they touch; carry the rest.
    carryforward: true

parsers:
  xml:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  - "src/test/**"
  - "**/src/test/**"
  - "src/main/resources/**"
  - "**/src/main/resources/**"
