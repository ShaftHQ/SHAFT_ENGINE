[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
required = false
# CHAOSENGINE:START
[mcp_servers."chaosengine-memory"]
command = "python3"
args = [".chaos-engine/tool.py", "memory-mcp"]
commandWindows = "py"
argsWindows = ["-3", ".chaos-engine/tool.py", "memory-mcp"]
cwd = "."
enabled_tools = ["inspect_memory", "load_memory", "remember_memory", "search_memory"]
default_tools_approval_mode = "auto"
required = false

[mcp_servers."chaosengine-memory".tools.remember_memory]
approval_mode = "prompt"

[mcp_servers."chaosengine-mempalace"]
command = "python3"
args = [".chaos-engine/tool.py", "mempalace-mcp"]
commandWindows = "py"
argsWindows = ["-3", ".chaos-engine/tool.py", "mempalace-mcp"]
cwd = "."
env = { MEMPALACE_EMBEDDING_MODEL = "minilm", MEMPALACE_BACKEND = "sqlite_exact" }

# CHAOSENGINE:END
