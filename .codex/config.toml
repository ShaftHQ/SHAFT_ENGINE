# CHAOSENGINE:START
[mcp_servers."chaosengine-memory"]
command = "python3"
args = [".chaos-engine/tool.py", "memory-mcp"]
commandWindows = "py"
argsWindows = ["-3", ".chaos-engine/tool.py", "memory-mcp"]
cwd = "."

[mcp_servers."chaosengine-mempalace"]
command = "python3"
args = [".chaos-engine/tool.py", "mempalace-mcp"]
commandWindows = "py"
argsWindows = ["-3", ".chaos-engine/tool.py", "mempalace-mcp"]
cwd = "."
env = { MEMPALACE_EMBEDDING_MODEL = "minilm", MEMPALACE_BACKEND = "sqlite_exact" }

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
# CHAOSENGINE:END
