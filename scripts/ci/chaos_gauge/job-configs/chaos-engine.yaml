job_name: chaos-gauge-chaos-engine
jobs_dir: scripts/ci/chaos_gauge/jobs
n_attempts: 5
n_concurrent_trials: 2
timeout_multiplier: 1.0
environment:
  type: docker
  delete: true
  cpu_enforcement_policy: limit
  memory_enforcement_policy: limit
retry:
  max_retries: 2
  include_exceptions:
    - EnvironmentStartError
    - EnvironmentBuildError
agents:
  - import_path: scripts.ci.chaos_gauge.agent:ChaosEngineCodex
    model_name: gpt-5.6-terra
    override_setup_timeout_sec: 900
    kwargs:
      version: "0.118.0"
      reasoning_effort: medium
      harness_source: chaos-engine
      harness_commit: "76772e015de7b8574da9813a195971690a0f69bf"
      harness_sha256: "03bd340d88d26177951551397b977d7454546739f34e0d6ad3154110abf27625"
      adapter_sha256: "3d081c632519b2fb9d6df271b198e4e1404cfd26bc68072e3104131c352db3bd"
datasets:
  - path: scripts/ci/chaos_gauge/dataset
